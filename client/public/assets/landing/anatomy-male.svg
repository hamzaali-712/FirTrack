<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" fill="none">
  <defs>
    <!-- Background glow gradients -->
    <radialGradient id="body-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stopColor="#489fb5" stopOpacity="0.25" />
      <stop offset="100%" stopColor="#0b2931" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="body-grad" x1="180" y1="40" x2="180" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#82c0cc" />
      <stop offset="35%" stopColor="#489fb5" />
      <stop offset="70%" stopColor="#16697a" />
      <stop offset="100%" stopColor="#103742" />
    </linearGradient>
    <linearGradient id="muscle-active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#ffa62b" />
      <stop offset="100%" stopColor="#ffc36f" />
    </linearGradient>
    <linearGradient id="muscle-secondary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#82c0cc" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#489fb5" stopOpacity="0.5" />
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="180" cy="240" r="150" fill="url(#body-glow)" />

  <!-- Scanning / HUD Guidelines -->
  <g opacity="0.4">
    <line x1="40" y1="120" x2="320" y2="120" stroke="#489fb5" stroke-dasharray="4 6" stroke-width="1" />
    <line x1="40" y1="210" x2="320" y2="210" stroke="#489fb5" stroke-dasharray="4 6" stroke-width="1" />
    <line x1="40" y1="310" x2="320" y2="310" stroke="#489fb5" stroke-dasharray="4 6" stroke-width="1" />
    <line x1="40" y1="420" x2="320" y2="420" stroke="#489fb5" stroke-dasharray="4 6" stroke-width="1" />
    <!-- HUD Target Marks -->
    <circle cx="180" cy="180" r="5" stroke="#ffa62b" stroke-width="1.5" fill="none" />
    <circle cx="180" cy="180" r="1.5" fill="#ffa62b" />
    <circle cx="130" cy="165" r="3" fill="#82c0cc" />
    <circle cx="230" cy="165" r="3" fill="#82c0cc" />
    <circle cx="150" cy="400" r="3" fill="#ffa62b" />
    <circle cx="210" cy="400" r="3" fill="#ffa62b" />
  </g>

  <!-- ATHLETIC MALE SILHOUETTE (Clean Vector Geometry) -->
  <g id="male-body" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.35))">
    <!-- Head & Neck -->
    <ellipse cx="180" cy="62" rx="22" ry="27" fill="url(#body-grad)" />
    <path d="M169 86 L191 86 L195 106 L165 106 Z" fill="url(#body-grad)" opacity="0.95" />

    <!-- Traps & Shoulders -->
    <path d="M165 106 C150 110, 130 118, 115 130 C110 134, 108 145, 112 158 L126 170 C132 155, 140 145, 155 138 Z" fill="url(#body-grad)" />
    <path d="M195 106 C210 110, 230 118, 245 130 C250 134, 252 145, 248 158 L234 170 C228 155, 220 145, 205 138 Z" fill="url(#body-grad)" />

    <!-- Chest (Pectorals) - Active Target Muscle Highlighted -->
    <path d="M142 140 C155 138, 175 140, 178 152 C178 168, 168 182, 145 182 C132 182, 126 170, 128 156 Z" fill="url(#muscle-active)" opacity="0.9" filter="url(#glow-filter)" />
    <path d="M218 140 C205 138, 185 140, 182 152 C182 168, 192 182, 215 182 C228 182, 234 170, 232 156 Z" fill="url(#muscle-active)" opacity="0.9" filter="url(#glow-filter)" />

    <!-- Torso / Core (Abs / Obliques) -->
    <path d="M148 188 C160 187, 174 187, 177 192 C177 202, 168 206, 150 206 C144 206, 144 195, 148 188 Z" fill="url(#muscle-secondary)" />
    <path d="M212 188 C200 187, 186 187, 183 192 C183 202, 192 206, 210 206 C216 206, 216 195, 212 188 Z" fill="url(#muscle-secondary)" />
    
    <path d="M150 212 C162 211, 174 211, 177 217 C177 228, 168 232, 152 232 C146 232, 146 220, 150 212 Z" fill="url(#muscle-secondary)" />
    <path d="M210 212 C198 211, 186 211, 183 217 C183 228, 192 232, 208 232 C214 232, 214 220, 210 212 Z" fill="url(#muscle-secondary)" />

    <path d="M152 238 C162 237, 174 237, 177 243 C177 254, 170 258, 154 258 C148 258, 148 246, 152 238 Z" fill="url(#muscle-secondary)" />
    <path d="M208 238 C198 237, 186 237, 183 243 C183 254, 190 258, 206 258 C212 258, 212 246, 208 238 Z" fill="url(#muscle-secondary)" />

    <!-- Lats / Core Frame -->
    <path d="M128 174 C132 195, 142 245, 154 270 L170 272 L168 280 L146 276 C136 248, 122 200, 120 172 Z" fill="url(#body-grad)" opacity="0.85" />
    <path d="M232 174 C228 195, 218 245, 206 270 L190 272 L192 280 L214 276 C224 248, 238 200, 240 172 Z" fill="url(#body-grad)" opacity="0.85" />

    <!-- Biceps & Forearms (Arms) -->
    <!-- Left Arm -->
    <path d="M110 162 C102 180, 96 210, 94 230 C92 240, 102 244, 108 236 C114 220, 120 190, 122 174 Z" fill="url(#muscle-active)" opacity="0.85" />
    <path d="M94 234 C90 255, 82 285, 78 305 C76 312, 84 316, 90 310 C96 295, 104 265, 106 242 Z" fill="url(#body-grad)" />
    <!-- Left Hand -->
    <path d="M77 308 C75 316, 73 328, 76 332 C78 335, 84 335, 86 328 L88 314 Z" fill="url(#body-grad)" opacity="0.8" />

    <!-- Right Arm -->
    <path d="M250 162 C258 180, 264 210, 266 230 C268 240, 258 244, 252 236 C246 220, 240 190, 238 174 Z" fill="url(#muscle-active)" opacity="0.85" />
    <path d="M266 234 C270 255, 278 285, 282 305 C284 312, 276 316, 270 310 C264 295, 256 265, 254 242 Z" fill="url(#body-grad)" />
    <!-- Right Hand -->
    <path d="M283 308 C285 316, 287 328, 284 332 C282 335, 276 335, 274 328 L272 314 Z" fill="url(#body-grad)" opacity="0.8" />

    <!-- Pelvis / Hips -->
    <path d="M152 272 L208 272 L216 304 C216 314, 202 320, 180 320 C158 320, 144 314, 144 304 Z" fill="url(#body-grad)" />

    <!-- Legs - Quads (Target Muscle Highlight) -->
    <!-- Left Quad -->
    <path d="M144 314 C136 340, 130 380, 134 420 C138 438, 156 442, 164 428 C172 400, 174 350, 176 320 Z" fill="url(#muscle-active)" opacity="0.9" filter="url(#glow-filter)" />
    <!-- Right Quad -->
    <path d="M216 314 C224 340, 230 380, 226 420 C222 438, 204 442, 196 428 C188 400, 186 350, 184 320 Z" fill="url(#muscle-active)" opacity="0.9" filter="url(#glow-filter)" />

    <!-- Knees -->
    <ellipse cx="148" cy="442" rx="14" ry="12" fill="url(#body-grad)" />
    <ellipse cx="212" cy="442" rx="14" ry="12" fill="url(#body-grad)" />

    <!-- Calves & Shins -->
    <path d="M138 454 C132 476, 128 505, 136 534 C140 546, 154 548, 158 538 C164 514, 162 480, 158 454 Z" fill="url(#body-grad)" />
    <path d="M222 454 C228 476, 232 505, 224 534 C220 546, 206 548, 202 538 C196 514, 198 480, 202 454 Z" fill="url(#body-grad)" />

    <!-- Feet -->
    <path d="M136 538 C130 550, 124 564, 120 572 C118 576, 122 580, 132 580 L160 580 C164 580, 164 574, 160 564 L156 538 Z" fill="url(#body-grad)" opacity="0.9" />
    <path d="M224 538 C230 550, 236 564, 240 572 C242 576, 238 580, 228 580 L200 580 C196 580, 196 574, 200 564 L204 538 Z" fill="url(#body-grad)" opacity="0.9" />
  </g>

  <!-- Fitness UI Overlay Badges -->
  <g>
    <!-- Upper Badge (Chest Focus) -->
    <rect x="236" y="132" width="104" height="26" rx="6" fill="#103742" fill-opacity="0.9" stroke="#ffa62b" stroke-width="1" />
    <circle cx="248" cy="145" r="4" fill="#ffa62b" />
    <text x="258" y="149" fill="#ede7e3" font-family="Manrope, sans-serif" font-size="10" font-weight="700">CHEST · 94%</text>
    <line x1="222" y1="152" x2="236" y2="145" stroke="#ffa62b" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Lower Badge (Quads Focus) -->
    <rect x="20" y="380" width="102" height="26" rx="6" fill="#103742" fill-opacity="0.9" stroke="#82c0cc" stroke-width="1" />
    <circle cx="32" cy="393" r="4" fill="#82c0cc" />
    <text x="42" y="397" fill="#ede7e3" font-family="Manrope, sans-serif" font-size="10" font-weight="700">QUADS · 88%</text>
    <line x1="122" y1="393" x2="138" y2="395" stroke="#82c0cc" stroke-width="1" stroke-dasharray="2 2" />
  </g>
</svg>
