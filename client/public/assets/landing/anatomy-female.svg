<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" fill="none">
  <defs>
    <!-- Background glow gradients -->
    <radialGradient id="fglow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stopColor="#489fb5" stopOpacity="0.25" />
      <stop offset="100%" stopColor="#0b2931" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="fgrad" x1="180" y1="40" x2="180" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#82c0cc" />
      <stop offset="35%" stopColor="#489fb5" />
      <stop offset="70%" stopColor="#16697a" />
      <stop offset="100%" stopColor="#103742" />
    </linearGradient>
    <linearGradient id="fmuscle-active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#ffa62b" />
      <stop offset="100%" stopColor="#ffc36f" />
    </linearGradient>
    <linearGradient id="fmuscle-secondary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#82c0cc" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#489fb5" stopOpacity="0.5" />
    </linearGradient>
    <filter id="fglow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="180" cy="240" r="150" fill="url(#fglow)" />

  <!-- Scanning / HUD Guidelines -->
  <g opacity="0.4">
    <line x1="40" y1="120" x2="320" y2="120" stroke="#489fb5" stroke-dasharray="4 6" stroke-width="1" />
    <line x1="40" y1="210" x2="320" y2="210" stroke="#489fb5" stroke-dasharray="4 6" stroke-width="1" />
    <line x1="40" y1="310" x2="320" y2="310" stroke="#489fb5" stroke-dasharray="4 6" stroke-width="1" />
    <line x1="40" y1="420" x2="320" y2="420" stroke="#489fb5" stroke-dasharray="4 6" stroke-width="1" />
    <!-- HUD Target Marks -->
    <circle cx="180" cy="235" r="5" stroke="#ffa62b" stroke-width="1.5" fill="none" />
    <circle cx="180" cy="235" r="1.5" fill="#ffa62b" />
    <circle cx="132" cy="165" r="3" fill="#82c0cc" />
    <circle cx="228" cy="165" r="3" fill="#82c0cc" />
    <circle cx="145" cy="400" r="3" fill="#ffa62b" />
    <circle cx="215" cy="400" r="3" fill="#ffa62b" />
  </g>

  <!-- ATHLETIC FEMALE SILHOUETTE (Clean Vector Geometry) -->
  <g id="female-body" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.35))">
    <!-- Head & Hair Knot -->
    <ellipse cx="180" cy="62" rx="20" ry="25" fill="url(#fgrad)" />
    <circle cx="180" cy="38" r="9" fill="url(#fgrad)" opacity="0.8" />
    <path d="M171 85 L189 85 L192 106 L168 106 Z" fill="url(#fgrad)" opacity="0.95" />

    <!-- Shoulders / Deltoids (Target Accent) -->
    <path d="M168 106 C155 110, 138 116, 126 128 C120 134, 118 144, 122 155 L132 165 C138 152, 145 142, 158 135 Z" fill="url(#fmuscle-active)" opacity="0.9" filter="url(#fglow-filter)" />
    <path d="M192 106 C205 110, 222 116, 234 128 C240 134, 242 144, 238 155 L228 165 C222 152, 215 142, 202 135 Z" fill="url(#fmuscle-active)" opacity="0.9" filter="url(#fglow-filter)" />

    <!-- Chest -->
    <path d="M145 142 C156 140, 174 142, 178 152 C178 168, 168 178, 148 178 C136 178, 132 168, 134 156 Z" fill="url(#fgrad)" />
    <path d="M215 142 C204 140, 186 142, 182 152 C182 168, 192 178, 212 178 C224 178, 228 168, 226 156 Z" fill="url(#fgrad)" />

    <!-- Tapered Waist & Abs Core (Active Muscle Highlight) -->
    <path d="M152 184 C162 183, 174 183, 177 188 C177 198, 170 202, 154 202 C148 202, 148 192, 152 184 Z" fill="url(#fmuscle-active)" opacity="0.9" filter="url(#fglow-filter)" />
    <path d="M208 184 C198 183, 186 183, 183 188 C183 198, 190 202, 206 202 C212 202, 212 192, 208 184 Z" fill="url(#fmuscle-active)" opacity="0.9" filter="url(#fglow-filter)" />
    
    <path d="M154 208 C164 207, 174 207, 177 212 C177 222, 170 226, 156 226 C150 226, 150 216, 154 208 Z" fill="url(#fmuscle-secondary)" />
    <path d="M206 208 C196 207, 186 207, 183 212 C183 222, 190 226, 204 226 C210 226, 210 216, 206 208 Z" fill="url(#fmuscle-secondary)" />

    <!-- Obliques & Hourglass Contour -->
    <path d="M136 172 C140 190, 148 220, 154 240 L166 242 L164 250 L146 248 C138 226, 130 195, 128 172 Z" fill="url(#fgrad)" opacity="0.85" />
    <path d="M224 172 C220 190, 212 220, 206 240 L194 242 L196 250 L214 248 C222 226, 230 195, 232 172 Z" fill="url(#fgrad)" opacity="0.85" />

    <!-- Arms -->
    <!-- Left Arm -->
    <path d="M120 160 C114 178, 108 206, 106 226 C104 235, 112 238, 118 232 C122 218, 128 190, 130 174 Z" fill="url(#fgrad)" />
    <path d="M106 230 C102 250, 94 280, 90 300 C88 307, 95 311, 101 306 C106 292, 114 262, 116 238 Z" fill="url(#fgrad)" />
    <path d="M89 303 C87 311, 85 323, 88 327 C90 330, 96 330, 98 323 L100 309 Z" fill="url(#fgrad)" opacity="0.8" />

    <!-- Right Arm -->
    <path d="M240 160 C246 178, 252 206, 254 226 C256 235, 248 238, 242 232 C238 218, 232 190, 230 174 Z" fill="url(#fgrad)" />
    <path d="M254 230 C258 250, 266 280, 270 300 C272 307, 265 311, 259 306 C254 292, 246 262, 244 238 Z" fill="url(#fgrad)" />
    <path d="M271 303 C273 311, 275 323, 272 327 C270 330, 264 330, 262 323 L260 309 Z" fill="url(#fgrad)" opacity="0.8" />

    <!-- Athletic Hips / Glutes -->
    <path d="M146 242 C134 256, 128 278, 136 304 C142 324, 160 326, 180 326 C200 326, 218 324, 224 304 C232 278, 226 256, 214 242 Z" fill="url(#fgrad)" />

    <!-- Glutes & Quads (Target Muscle Highlight) -->
    <!-- Left Leg -->
    <path d="M142 320 C134 345, 128 385, 134 420 C138 438, 154 442, 162 428 C170 400, 172 350, 174 322 Z" fill="url(#fmuscle-active)" opacity="0.9" filter="url(#fglow-filter)" />
    <!-- Right Leg -->
    <path d="M218 320 C226 345, 232 385, 226 420 C222 438, 206 442, 198 428 C190 400, 188 350, 186 322 Z" fill="url(#fmuscle-active)" opacity="0.9" filter="url(#fglow-filter)" />

    <!-- Knees -->
    <ellipse cx="148" cy="442" rx="12" ry="11" fill="url(#fgrad)" />
    <ellipse cx="212" cy="442" rx="12" ry="11" fill="url(#fgrad)" />

    <!-- Calves & Shins -->
    <path d="M140 454 C134 476, 130 505, 137 534 C141 546, 153 548, 157 538 C162 514, 160 480, 156 454 Z" fill="url(#fgrad)" />
    <path d="M220 454 C226 476, 230 505, 223 534 C219 546, 207 548, 203 538 C198 514, 200 480, 204 454 Z" fill="url(#fgrad)" />

    <!-- Feet -->
    <path d="M137 538 C131 550, 126 564, 122 572 C120 576, 124 580, 134 580 L160 580 C164 580, 164 574, 160 564 L156 538 Z" fill="url(#fgrad)" opacity="0.9" />
    <path d="M223 538 C229 550, 234 564, 238 572 C240 576, 236 580, 226 580 L200 580 C196 580, 196 574, 200 564 L204 538 Z" fill="url(#fgrad)" opacity="0.9" />
  </g>

  <!-- Fitness UI Overlay Badges -->
  <g>
    <!-- Upper Badge (Core Focus) -->
    <rect x="236" y="196" width="104" height="26" rx="6" fill="#103742" fill-opacity="0.9" stroke="#ffa62b" stroke-width="1" />
    <circle cx="248" cy="209" r="4" fill="#ffa62b" />
    <text x="258" y="213" fill="#ede7e3" font-family="Manrope, sans-serif" font-size="10" font-weight="700">CORE · 96%</text>
    <line x1="214" y1="209" x2="236" y2="209" stroke="#ffa62b" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Lower Badge (Glutes Focus) -->
    <rect x="20" y="320" width="102" height="26" rx="6" fill="#103742" fill-opacity="0.9" stroke="#82c0cc" stroke-width="1" />
    <circle cx="32" cy="333" r="4" fill="#82c0cc" />
    <text x="42" y="337" fill="#ede7e3" font-family="Manrope, sans-serif" font-size="10" font-weight="700">GLUTES · 91%</text>
    <line x1="122" y1="333" x2="136" y2="333" stroke="#82c0cc" stroke-width="1" stroke-dasharray="2 2" />
  </g>
</svg>
